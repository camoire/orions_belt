services:
  api:
    build:
      context: .
      dockerfile: dockerfile.dev
    container_name: orionsbelt-dev
    ports:
      - "8000:8000"
    environment:
      QWEN_GGUF_PATH: /app/qwen_model/qwen2.5-coder-14b-instruct-q6_k-00001-of-00002.gguf
      BLIP_MODEL_PATH: /app/blip_model
    volumes:
      - ./logs:/app/logs
      - ./dataset:/app/dataset
      - ./lora_adapter:/app/lora_adapter
      - ./qwen_model:/app/qwen_model:ro
      - ./blip_model:/app/blip_model:ro
    restart: unless-stopped
